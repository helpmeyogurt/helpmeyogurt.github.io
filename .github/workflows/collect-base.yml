# helpmeyogurt.github.io repo의 .github/workflows/collect-base.yml 로 복사할 것.
# 기준금리(한국·미국) → intrate/base.json. 1시간 주기 — 값이 바뀔 때만 커밋(수집기가 무변경 저장 생략).
name: collect-base

on:
  schedule:
    - cron: '37 * * * *'    # 매시 37분 (정각 근처 스로틀링 회피)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-base
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/live-gate.yml

  collect:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect base rates
        env:
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: |
          for i in 1 2; do
            node tools/collect_base_rates.js intrate/base.json && exit 0
            echo "attempt $i failed; retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Commit & push
        run: |
          git config user.name 'yogurt'
          git config user.email '60679462+helpmeyogurt@users.noreply.github.com'
          git add intrate/base.json
          git diff --cached --quiet && echo 'no change' && exit 0
          git commit -m "intrate: 기준금리 갱신 $(TZ=Asia/Seoul date +%m-%d\ %H:%M)"
          git push origin main \
            || { git fetch origin main && git rebase --onto origin/main HEAD~1 && git push origin main; }
