# helpmeyogurt.github.io repo의 .github/workflows/collect-aladin-now.yml 로 복사할 것.
# 알라딘 실시간(NowBest) 스냅샷 → book/aladin_now.json (30분 주기).
# 앱은 라이브가 1순위 — 이 스냅샷은 첫 진입(로컬 캐시 없음)의 임시 표시용.
#
# 커밋 폭증 방지: 직전 커밋도 스냅샷 커밋이면 amend-squash(둘을 하나로 합쳐
# force-with-lease push) — 스냅샷 커밋이 히스토리에 1개만 유지된다.
# 다른 워크플로가 그 사이 커밋했으면 일반 커밋으로 폴백(충돌 없음).
# ※ GitHub Actions 크론은 지연/스킵이 흔해 실제 간격은 30~60분 — 임시 표시 용도로 충분.
name: collect-aladin-now

on:
  schedule:
    - cron: '13,43 * * * *'  # 30분 주기, 정각/반정각 회피 (실제는 러너 사정에 따라 지연)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-aladin-now
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/live-gate.yml

  collect:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5    # amend-squash에 직전 커밋 필요

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect aladin NowBest snapshot
        run: |
          for i in 1 2 3 4 5; do
            node tools/collect_aladin_now.js book/aladin_now.json && exit 0
            echo "attempt $i failed; retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Commit & push (amend-squash)
        run: |
          git config user.name 'yogurt'
          git config user.email '60679462+helpmeyogurt@users.noreply.github.com'
          git add book/aladin_now.json
          git diff --cached --quiet && echo 'no change' && exit 0
          SUBJ="book: 실시간 스냅샷"
          LAST=$(git log -1 --pretty=%s)
          git commit -m "$SUBJ $(TZ=Asia/Seoul date +%m-%d\ %H:%M)"
          case "$LAST" in
            "$SUBJ"*)
              # 직전 커밋도 스냅샷 → 둘을 하나로 합쳐 히스토리 1개 유지
              git reset --soft HEAD~2
              git commit -m "$SUBJ $(TZ=Asia/Seoul date +%m-%d\ %H:%M)"
              git push --force-with-lease origin main \
                || { git fetch origin main && git rebase --onto origin/main HEAD~1 && git push origin main; }
              ;;
            *)
              git push origin main \
                || { git fetch origin main && git rebase --onto origin/main HEAD~1 && git push origin main; }
              ;;
          esac
