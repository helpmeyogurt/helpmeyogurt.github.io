# helpmeyogurt.github.io repo의 .github/workflows/collect-music-now.yml 로 복사할 것.
# 실시간 음원 차트 3종 스냅샷 → music/now.json (30분 주기, amend-squash로 히스토리 1개 유지).
name: collect-music-now

on:
  schedule:
    - cron: '18,48 * * * *'   # 30분 주기, 정각/반정각 회피
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-music-now
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/live-gate.yml

  collect:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5    # amend-squash에 직전 커밋 필요

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect realtime snapshot
        run: |
          for i in 1 2 3 4 5; do
            node tools/collect_music_now.js music/now.json && exit 0
            echo "attempt $i failed; retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Commit & push (amend-squash)
        run: |
          git config user.name 'yogurt'
          git config user.email '60679462+helpmeyogurt@users.noreply.github.com'
          git add music/now.json
          git diff --cached --quiet && echo 'no change' && exit 0
          SUBJ="music: 실시간 스냅샷"
          LAST=$(git log -1 --pretty=%s)
          git commit -m "$SUBJ $(TZ=Asia/Seoul date +%m-%d\ %H:%M)"
          case "$LAST" in
            "$SUBJ"*)
              git reset --soft HEAD~2
              git commit -m "$SUBJ $(TZ=Asia/Seoul date +%m-%d\ %H:%M)"
              git push --force-with-lease origin main \
                || { git fetch origin main && git rebase --onto origin/main HEAD~1 && git push origin main; }
              ;;
            *)
              git push origin main \
                || { git fetch origin main && git rebase --onto origin/main HEAD~1 && git push origin main; }
              ;;
          esac
