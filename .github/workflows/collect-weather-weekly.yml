# 주간 예보(전국 시군구 10일) → weather/weekly.json.
# 네이버 today 페이지 SSR의 domesticWeeklyFcastList 파싱(choiceApi엔 주간 모듈 없음).
# 주간은 느리게 바뀌어 하루 3회면 충분. nowFcast(10분) 워크플로와 concurrency 분리 —
# 이 잡은 250개 HTML 파싱으로 ~5분 걸려 nowFcast에 취소되면 안 되므로 별도.
name: collect-weather-weekly

on:
  schedule:
    - cron: '23 21 * * *'   # KST 06:23
    - cron: '23 3 * * *'    # KST 12:23
    - cron: '23 9 * * *'    # KST 18:23
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-weather-weekly
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/live-gate.yml

  collect:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect weekly
        run: |
          for i in 1 2 3; do
            node tools/collect_weather.js --weekly && exit 0
            echo "attempt $i failed; retry in 30s"; sleep 30
          done
          exit 1

      - name: Commit & push (amend-squash)
        run: |
          git config user.name 'yogurt'
          git config user.email '60679462+helpmeyogurt@users.noreply.github.com'
          git add weather/weekly.json
          git diff --cached --quiet && echo 'no change' && exit 0
          SUBJ="weather: 주간 스냅샷"
          LAST=$(git log -1 --pretty=%s)
          git commit -m "$SUBJ $(TZ=Asia/Seoul date +%m-%d\ %H:%M)"
          case "$LAST" in
            "$SUBJ"*)
              git reset --soft HEAD~2
              git commit -m "$SUBJ $(TZ=Asia/Seoul date +%m-%d\ %H:%M)"
              git push --force-with-lease origin main || { git fetch origin main && git rebase --onto origin/main HEAD~1 && git push origin main; }
              ;;
            *)
              git push origin main || { git fetch origin main && git rebase --onto origin/main HEAD~1 && git push origin main; }
              ;;
          esac
