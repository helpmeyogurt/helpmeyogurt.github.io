# helpmeyogurt.github.io repo의 .github/workflows/collect-car.yml 로 복사할 것.
# 국내 월간 판매(0901) → car/month.json. 커밋 메시지는 무브랜드 정책.
name: collect-car

on:
  schedule:
    - cron: '25 20 * * *'   # KST 05:25
    - cron: '25 1 * * *'    # KST 10:25 (캐치업)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-car
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/live-gate.yml

  collect:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect monthly sales
        run: |
          for i in 1 2 3; do
            node tools/collect_car_month.js car/month.json && exit 0
            echo "attempt $i failed; retrying in 60s"
            sleep 60
          done
          exit 1

      - name: Collect upcoming models
        run: |
          for i in 1 2 3; do
            node tools/collect_car_coming.js car/coming.json && exit 0
            echo "attempt $i failed; retrying in 60s"
            sleep 60
          done
          exit 1

      - name: Collect certifications
        continue-on-error: true   # 보조 데이터(인증현황) 실패해도 메인(판매/출시예정) 커밋은 진행
        env:
          DATAGO_KEY: ${{ secrets.DATAGO_KEY }}
        run: |
          for i in 1 2 3; do
            node tools/collect_car_kencis.js car/kencis.json && exit 0
            echo "attempt $i failed; retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Commit & push
        run: |
          git config user.name 'yogurt'
          git config user.email '60679462+helpmeyogurt@users.noreply.github.com'
          git add car/
          git diff --cached --quiet && echo 'no change' && exit 0
          git commit -m "car: 데이터 갱신 $(TZ=Asia/Seoul date +%m-%d)"
          git push origin main \
            || { git fetch origin main && git rebase --onto origin/main HEAD~1 && git push origin main; }
