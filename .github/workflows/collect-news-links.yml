# helpmeyogurt.github.io repo의 .github/workflows/collect-news-links.yml 로 복사할 것.
# 뉴스/커뮤니티 링크 헬스체크(리다이렉트 자가 치유) → news/links.json. 주 1회.
name: collect-news-links

on:
  schedule:
    - cron: '50 20 * * 1'   # 매주 화요일 KST 05:50
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-news-links
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/live-gate.yml

  collect:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Healthcheck links
        run: |
          for i in 1 2 3; do
            node tools/collect_news_links.js news/links.json && exit 0
            echo "attempt $i failed; retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Commit & push
        run: |
          git config user.name 'yogurt'
          git config user.email '60679462+helpmeyogurt@users.noreply.github.com'
          git add news/links.json
          git diff --cached --quiet && echo 'no change' && exit 0
          git commit -m "news: 링크 점검 $(TZ=Asia/Seoul date +%m-%d)"
          git push origin main \
            || { git fetch origin main && git rebase --onto origin/main HEAD~1 && git push origin main; }
