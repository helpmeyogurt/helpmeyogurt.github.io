# helpmeyogurt.github.io repo의 .github/workflows/collect-book.yml 로 복사할 것.
# 서점 3사(교보/YES24/알라딘) 베스트셀러를 매일 새벽 수집 → book/ 커밋.
# 크론 스킵 대비: 캐치업 2회 + --if-missing(오늘자 있으면 스킵).
name: collect-book-bestsellers

on:
  schedule:
    - cron: '30 19 * * *'   # KST 04:30
    - cron: '0 20 * * *'    # KST 05:00 (1차 실패/지연 대비)
    - cron: '35 0 * * *'    # KST 09:35 (캐치업)
    - cron: '35 4 * * *'    # KST 13:35 (막차 캐치업)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-book
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/live-gate.yml

  collect:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 예약 실행은 --if-missing / 수동 실행은 강제 재수집. 잡 안 3회 재시도.
      # 서점별 부분 실패는 기존 파일 유지(스크립트 내장) — 셋 다 실패 시에만 잡 실패.
      - name: Collect bestsellers (kyobo/yes24/aladin)
        run: |
          FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ]; then FLAG="--if-missing"; fi
          for i in 1 2 3; do
            node tools/collect_book_bestsellers.js book $FLAG && exit 0
            echo "attempt $i failed; retrying in 60s"
            sleep 60
          done
          exit 1

      - name: Commit & push
        run: |
          git config user.name 'yogurt'
          git config user.email '60679462+helpmeyogurt@users.noreply.github.com'
          git add book/kyobo.json book/yes24.json book/aladin.json
          git diff --cached --quiet && echo 'no change' && exit 0
          git commit -m "book: 베스트셀러 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M)"
          git push || { git fetch origin main && git rebase --onto origin/main HEAD~1 && git push origin main; }
