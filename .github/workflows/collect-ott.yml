# helpmeyogurt.github.io repo의 .github/workflows/collect-ott.yml 로 복사할 것.
# 매일 새벽 4시(KST) 웨이브/티빙 TOP 20을 수집해 ott/ott_top20.json 으로 커밋.
# cron은 UTC 기준 (KST-9). 정시 지연이 흔해서 4:07 + 실패 대비 4:40/5:10 3회 예약.
name: collect-ott-top20

on:
  schedule:
    - cron: '7 19 * * *'    # KST 04:07
    - cron: '40 19 * * *'   # KST 04:40 (1차 실패/지연 대비)
    - cron: '10 20 * * *'   # KST 05:10 (2차 대비)
    - cron: '5 0 * * *'     # KST 09:05 (캐치업 — 새벽 크론 전체 스킵 대비)
    - cron: '5 4 * * *'     # KST 13:05 (막차 캐치업)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-ott
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/live-gate.yml

  collect:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 수집 (일시 오류 대비 잡 안에서도 3회 재시도)
      # 예약 실행은 --if-missing: 오늘치가 이미 있으면 스킵 → 캐치업 크론이
      # 성공한 날 중복 수집·커밋을 안 만든다. 수동 실행은 강제 재수집.
      - name: Collect OTT TOP 20
        run: |
          FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ]; then FLAG="--if-missing"; fi
          for i in 1 2 3; do
            node tools/collect_ott_top20.js ott/ott_top20.json $FLAG && exit 0
            echo "attempt $i failed; retrying in 60s"
            sleep 60
          done
          exit 1

      # 변경이 있을 때만 커밋 (이 커밋이 저장소 활동이 되어 60일 자동비활성도 예방)
      - name: Commit & push
        run: |
          git config user.name 'yogurt'
          git config user.email '60679462+helpmeyogurt@users.noreply.github.com'
          git add ott/ott_top20.json ott/ott_top20_history.json
          git diff --cached --quiet && echo 'no change' && exit 0
          git commit -m "ott: TOP 20 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M)"
          git push || { git fetch origin main && git rebase --onto origin/main HEAD~1 && git push origin main; }
