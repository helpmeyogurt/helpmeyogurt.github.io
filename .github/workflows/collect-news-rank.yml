# helpmeyogurt.github.io repo의 .github/workflows/collect-news-rank.yml 로 복사할 것.
# 많이 본 뉴스 랭킹(종합30+섹션5×10) → news/rank.json. 1시간 주기, amend-squash로 히스토리 1커밋 유지.
name: collect-news-rank

on:
  schedule:
    - cron: '12,32,52 * * * *'   # 20분 주기(정각 회피) — 스로틀링으로 간격 벌어져도 앱 신선도(8h) 내 유지
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-news-rank
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/live-gate.yml

  collect:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5    # amend-squash에 직전 커밋 필요

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect news rank
        run: |
          for i in 1 2 3; do
            node tools/collect_news_rank.js news/rank.json && exit 0
            echo "attempt $i failed; retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Commit & push (amend-squash)
        run: |
          git config user.name 'yogurt'
          git config user.email '60679462+helpmeyogurt@users.noreply.github.com'
          git add news/rank.json
          git diff --cached --quiet && echo 'no change' && exit 0
          SUBJ="news: 랭킹 스냅샷"
          LAST=$(git log -1 --pretty=%s)
          git commit -m "$SUBJ $(TZ=Asia/Seoul date +%m-%d\ %H:%M)"
          case "$LAST" in
            "$SUBJ"*)
              git reset --soft HEAD~2
              git commit -m "$SUBJ $(TZ=Asia/Seoul date +%m-%d\ %H:%M)"
              git push --force-with-lease origin main \
                || { git fetch origin main && git rebase --onto origin/main HEAD~1 && git push origin main; }
              ;;
            *)
              git push origin main \
                || { git fetch origin main && git rebase --onto origin/main HEAD~1 && git push origin main; }
              ;;
          esac
