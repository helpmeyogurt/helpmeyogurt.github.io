# 도구 데이터 수집 → tool/holidays.json (공휴일, 천문연 특일정보).
# 하루 1회 + 캐치업. 임시공휴일 지정에 대비해 매일 갱신.
name: collect-tool

on:
  schedule:
    - cron: '7 21 * * *'    # KST 06:07
    - cron: '7 2 * * *'     # KST 11:07 (캐치업)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-tool
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/live-gate.yml

  collect:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect holidays
        env:
          DATAGO_KEY: ${{ secrets.DATAGO_TOOL_KEY }}
        run: |
          for i in 1 2 3; do
            node tools/collect_tool_holidays.js && exit 0
            echo "attempt $i failed; retry in 30s"; sleep 30
          done
          exit 1

      # 확장 데이터(환율/일출일몰/대기질) — 보조라 실패해도 공휴일 커밋은 진행
      - name: Collect fx/sun/air
        continue-on-error: true
        env:
          DATAGO_KEY: ${{ secrets.DATAGO_TOOL_KEY }}
          KOREAEXIM_KEY: ${{ secrets.KOREAEXIM_KEY }}
        run: node tools/collect_tool_ext.js

      - name: Commit & push (amend-squash)
        run: |
          git config user.name 'yogurt'
          git config user.email '60679462+helpmeyogurt@users.noreply.github.com'
          git add tool/
          git diff --cached --quiet && echo 'no change' && exit 0
          SUBJ="tool: 데이터 스냅샷"
          LAST=$(git log -1 --pretty=%s)
          git commit -m "$SUBJ $(TZ=Asia/Seoul date +%m-%d)"
          case "$LAST" in
            "$SUBJ"*)
              git reset --soft HEAD~2
              git commit -m "$SUBJ $(TZ=Asia/Seoul date +%m-%d)"
              git push --force-with-lease origin main || { git fetch origin main && git rebase --onto origin/main HEAD~1 && git push origin main; }
              ;;
            *)
              git push origin main || { git fetch origin main && git rebase --onto origin/main HEAD~1 && git push origin main; }
              ;;
          esac
